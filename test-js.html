<!DOCTYPE html>
<html>
    <head>
        <title>Teste JavaScript</title>
        <meta charset="UTF-8"/>
        <script>
            function acendeLampada(){
                const luz = document.getElementById("luz");                
                luz.src ="_imagens/lampada-acesa.jpg";
                
            }
            function apagaLampada(){
                const luz = document.getElementById("luz");
                luz.src ="_imagens/lampada-apagada.jpg";
            }
            function quebraLampada(){
                const luz = document.getElementById("luz");
                luz.src ="_imagens/lampada-quebrada.jpg";
                
            }
        </script>
    </head>
    <body>
        <h1>Acenda a Lâmpada</h1>
        <img src="_imagens/lampada-apagada.jpg" id="luz" onmouseenter="acendeLampada()" onmouseout="apagaLampada()" onclick="quebraLampada()"/>


    </body>
</html>
